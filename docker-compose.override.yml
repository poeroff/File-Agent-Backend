# Development-only overrides. Compose merges this automatically on top of
# docker-compose.yml whenever you run `docker compose up` without -f.
# This is what switches the container to `nest start --watch` with hot
# reload — do NOT use this for a real deployment. For a production run, see
# the -f command noted at the top of docker-compose.yml.
services:
  main-server:
    build:
      target: dev
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      # tsc's default watcher misses fs events through Docker Desktop's
      # Windows bind mount, so force it to poll instead.
      - TSC_WATCHFILE=PriorityPollingInterval
      - TSC_WATCHDIRECTORY=DynamicPriorityPolling
    volumes:
      - ./server/main_server:/app
      - /app/node_modules
