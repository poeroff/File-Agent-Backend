services:
  main-server:
    build:
      context: ./server/main_server
    env_file:
      - .env
    ports:
      - "${MAIN_SERVER_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
