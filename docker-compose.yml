# Production base config — builds the `runner` stage (nest build + node dist/main).
# Run this alone with: docker compose -f docker-compose.yml up -d --build
#
# For local development, don't run this file by itself — just use
# `docker compose up -d --build` (no -f flag), which auto-merges
# docker-compose.override.yml on top and switches to the dev stage
# with hot reload instead.
services:
  main-server:
    build:
      context: ./server/main_server
    env_file:
      - .env
    ports:
      - "${MAIN_SERVER_PORT:-4000}:4000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    # Host port 3307 because the local MySQL install still squats 3306;
    # containers talk to it on 3306 via the compose network regardless.
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  mysql-data:
